name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
            archive: tar
          - os: macos-latest
            asset: macos-x64
            archive: tar
          - os: windows-latest
            asset: windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          if [ ! -f /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc ] && [ -f /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          fi

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build CLI (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build
          go build -o build/qr-generator-cli ./cmd/qr_generator

      - name: Build CLI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build | Out-Null
          go build -o build\qr-generator-cli.exe .\cmd\qr_generator

      - name: Build GUI
        shell: bash
        run: |
          cd gui
          wails build

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          mkdir -p package
          cp build/qr-generator-cli package/
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -R gui/build/bin/qr-generator.app package/
          else
            cp gui/build/bin/qr-generator package/
          fi
          cp variants.json README.md LICENSE package/
          tar -czf qr-generator-${{ matrix.asset }}.tar.gz -C package .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build\qr-generator-cli.exe package/
          Copy-Item gui\build\bin\qr-generator.exe package/
          Copy-Item variants.json, README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath qr-generator-${{ matrix.asset }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qr-generator-${{ matrix.asset }}
          path: |
            qr-generator-*.tar.gz
            qr-generator-*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/qr-generator-*.tar.gz
            artifacts/qr-generator-*.zip
          fail_on_unmatched_files: false
