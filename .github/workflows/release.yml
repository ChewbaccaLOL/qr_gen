name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
            archive: tar
          - os: macos-latest
            asset: macos-x64
            archive: tar
          - os: windows-latest
            asset: windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cairo pango gdk-pixbuf

      - name: Install system deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y gtk-runtime
          choco install -y msys2

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller segno cairosvg pillow

      - name: Build binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --name qr-generator-cli qr_generator.py
          pyinstaller --onefile --name qr-generator qr_gui.py

      - name: Build binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $candidatePaths = @(
            "C:\Program Files\GTK3-Runtime Win64\bin",
            "C:\Program Files\GTK3-Runtime\bin",
            "C:\gtk\bin",
            "$env:ChocolateyInstall\lib\gtk-runtime\tools\gtk3-runtime\bin",
            "$env:ChocolateyInstall\lib\gtk-runtime\tools\bin"
          )
          $gtk = $null
          foreach ($path in $candidatePaths) {
            if (Test-Path $path) {
              $gtk = $path
              break
            }
          }
          if (-not $gtk) {
            $searchRoot = "$env:ChocolateyInstall\lib\gtk-runtime\tools"
            if (Test-Path $searchRoot) {
              $found = Get-ChildItem $searchRoot -Recurse -Filter "libcairo-2.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $gtk = $found.DirectoryName
              }
            }
          }
          if (-not $gtk) {
            $msys = "C:\msys64"
            if (Test-Path $msys) {
              & "$msys\usr\bin\bash.exe" -lc "pacman -S --noconfirm mingw-w64-x86_64-cairo mingw-w64-x86_64-pango mingw-w64-x86_64-gdk-pixbuf"
              $msysBin = "$msys\mingw64\bin"
              if (Test-Path $msysBin) {
                $gtk = $msysBin
              }
            }
          }
          if (-not $gtk) {
            Write-Error "GTK runtime not found (needed for cairo)."
            exit 1
          }
          $dlls = Get-ChildItem $gtk -Filter *.dll
          $args = @()
          foreach ($dll in $dlls) {
            $args += "--add-binary"
            $args += "$($dll.FullName);."
          }
          pyinstaller --onefile --name qr-generator-cli qr_generator.py
          pyinstaller --onefile --name qr-generator qr_gui.py @args

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          mkdir -p package
          cp dist/qr-generator-cli package/
          cp dist/qr-generator package/
          cp README.md LICENSE package/
          tar -czf qr-generator-${{ matrix.asset }}.tar.gz -C package .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/qr-generator-cli.exe package/
          Copy-Item dist/qr-generator.exe package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath qr-generator-${{ matrix.asset }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qr-generator-${{ matrix.asset }}
          path: |
            qr-generator-*.tar.gz
            qr-generator-*.zip

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qr-generator-*.tar.gz
            qr-generator-*.zip
